gradle.projectsEvaluated {
  def backendProject = gradle.rootProject
  backendProject.tasks.register('compileMigrationRepair', JavaCompile) {
    source = backendProject.files('tools/RepairMigrationHistory.java')
    classpath = backendProject.sourceSets.main.runtimeClasspath
    destinationDirectory.set(backendProject.layout.buildDirectory.dir('migration-repair'))
    javaCompiler.set(backendProject.javaToolchains.compilerFor { languageVersion.set(JavaLanguageVersion.of(21)) })
  }
  backendProject.tasks.register('repairMigrationHistory', JavaExec) {
    dependsOn 'compileMigrationRepair'
    classpath = backendProject.sourceSets.main.runtimeClasspath + backendProject.files(backendProject.layout.buildDirectory.dir('migration-repair'))
    mainClass.set('RepairMigrationHistory')
    javaLauncher.set(backendProject.javaToolchains.launcherFor { languageVersion.set(JavaLanguageVersion.of(21)) })
    doFirst {
      def databaseName = backendProject.findProperty('databaseName') ?: 'loja'
      if (!(databaseName in ['loja', 'loja_test'])) throw new GradleException('Escolha loja ou loja_test')
      args 'jdbc:postgresql://127.0.0.1:5433/' + databaseName, 'loja', backendProject.file('src/main/resources/db/migration').absolutePath
    }
  }
}