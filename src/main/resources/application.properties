spring.application.name=BackendLoja
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5433/loja}
spring.datasource.username=${DB_USER:loja}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.error.include-message=never
loja.allowed-origin=${FRONTEND_ORIGIN:http://localhost:3000}
loja.bootstrap.enabled=${BOOTSTRAP_ENABLED:false}
loja.bootstrap.email=${MANAGER_EMAIL:}
loja.bootstrap.password=${MANAGER_PASSWORD:}
loja.jwt.issuer=loja-api
loja.jwt.audience=loja-frontend
loja.jwt.secret=${JWT_SECRET}
loja.cookie.secure=true
server.forward-headers-strategy=none
server.max-http-request-header-size=16KB
server.tomcat.connection-timeout=10s
server.tomcat.max-connections=200
server.tomcat.threads.max=100
server.tomcat.max-http-form-post-size=256KB
