spring.application.name=BackendFlorir
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5433/florir}
spring.datasource.username=${DB_USER:florir}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.error.include-message=never
florir.allowed-origin=${FRONTEND_ORIGIN:http://localhost:3000}
florir.bootstrap.enabled=${BOOTSTRAP_ENABLED:false}
florir.bootstrap.email=${MANAGER_EMAIL:}
florir.bootstrap.password=${MANAGER_PASSWORD:}
florir.jwt.issuer=florir-api
florir.jwt.audience=florir-frontend
florir.jwt.secret=${JWT_SECRET}
florir.cookie.secure=true
